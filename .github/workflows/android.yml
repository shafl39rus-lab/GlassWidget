name: Сборка APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk GlassWidget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlassWidget-APK
          path: GlassWidget.apk
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlassWidget-APK
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" GlassWidget.apk --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "GlassWidget $RELEASE_TAG" \
            --notes "Подписанная сборка для Android 12–16 из GitHub Actions #$GITHUB_RUN_ID."
