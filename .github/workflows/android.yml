name: Сборка APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36"
      - run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk GlassWidget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlassWidget-APK
          path: GlassWidget.apk
          if-no-files-found: error
